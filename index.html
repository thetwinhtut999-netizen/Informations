      // Myanmar Clock Live Update (UTC+6:30)
      function startMyanmarClock() {
          function updateClock() {
              const now = new Date();
              // Convert to Myanmar Standard Time (+6:30)
              const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
              const mmTime = new Date(utc + (3600000 * 6.5));
              
              let hours = mmTime.getHours();
              const minutes = String(mmTime.getMinutes()).padStart(2, '0');
              const seconds = String(mmTime.getSeconds()).padStart(2, '0');
              const ampm = hours >= 12 ? 'ညနေ / ည' : 'နံနက် / နေ့';
              hours = hours % 12;
              hours = hours ? hours : 12; // the hour '0' should be '12'
              const strHours = String(hours).padStart(2, '0');

              const days = ['တနင်္ဂနွေ', 'တနင်္လာ', 'အင်္ဂါ', 'ဗုဒ္ဓဟူး', 'ကြာသပတေး', 'သောကြာ', 'စနေ'];
              const dayName = days[mmTime.getDay()];
              const dateNum = mmTime.getDate();
              const months = ['ဇန်နဝါရီ', 'ဖေဖော်ဝါရီ', 'မတ်', 'ဧပြီ', 'မေ', 'ဇွန်', 'ဇူလိုင်', 'သြဂုတ်', 'စက်တင်ဘာ', 'အောက်တိုဘာ', 'နိုဝင်ဘာ', 'ဒီဇင်ဘာ'];
              const monthName = months[mmTime.getMonth()];
              const year = mmTime.getFullYear();

              const clockEl = document.getElementById('mmClockDisplay');
              const dateEl = document.getElementById('mmDateDisplay');
              if(clockEl) clockEl.textContent = `${strHours}:${minutes}:${seconds} ${ampm}`;
              if(dateEl) dateEl.textContent = `${dayName}၊ ${dateNum} ${monthName} ${year}`;
          }
          updateClock();
          setInterval(updateClock, 1000);
      }

      // Notification Audio & Toast Popup Alert
      function playNotificationSound() {
          try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 note
              osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5 note
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.4);
          } catch(e) {}
      }

      // Geolocation Weather Effects Integration
      async function initWeatherEffect() {
          const fxLayer = document.getElementById('weather-fx-layer');
          if(!fxLayer) return;

          let weatherType = 'clear'; 

          if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(async (position) => {
                  const lat = position.coords.latitude;
                  const lon = position.coords.longitude;
                  try {
                      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                      const data = await res.json();
                      const code = data.current_weather.weathercode;
                      
                      if ([51,53,55,61,63,65,80,81,82].includes(code)) {
                          weatherType = 'rain';
                      } else if ([95,96,99].includes(code)) {
                          weatherType = 'thunderstorm';
                      } else if ([0, 1].includes(code)) {
                          weatherType = 'sunny';

                      renderWeatherFX('clear', fxLayer);
                  }
              }, () => {
                  renderWeatherFX('clear', fxLayer);
              });
          } else {
              renderWeatherFX('clear', fxLayer);
          }
      }

      function renderWeatherFX(type, container) {
          container.innerHTML = '';
          if (type === 'rain') {
              for (let i = 0; i < 40; i++) {
                  const drop = document.createElement('div');
                  drop.className = 'raindrop';
                  drop.style.left = `${Math.random() * 100}%`;
                  drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                  drop.style.animationDelay = `${Math.random() * 2}s`;
                  container.appendChild(drop);
              }
          } else if (type === 'thunderstorm') {
              for (let i = 0; i < 30; i++) {
                  const drop = document.createElement('div');
                  drop.className = 'raindrop';
                  drop.style.left = `${Math.random() * 100}%`;
                  drop.style.animationDuration = `${0.3 + Math.random() * 0.3}s`;
                  container.appendChild(drop);
              }
              const flash = document.createElement('div');
              flash.className = 'lightning-flash';
              flash.style.animation = 'flashAnim 5s infinite';
              container.appendChild(flash);
          } else if (type === 'sunny') {
              const sun = document.createElement('div');
              sun.className = 'sun-ray';
              container.appendChild(sun);
          } else {
              const notes = ['♪', '♫', '♬', '♩'];
              for (let i = 0; i < 15; i++) {
                  const note = document.createElement('div');
                  note.className = 'music-note';
                  note.textContent = notes[Math.floor(Math.random() * notes.length)];
                  note.style.left = `${Math.random() * 100}%`;
                  note.style.animationDuration = `${3 + Math.random() * 3}s`;
                  note.style.animationDelay = `${Math.random() * 3}s`;
                  container.appendChild(note);
              }
          }
      }
