<!DOCTYPE html>
<html lang="my" data-theme="light" data-accent="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Informations 🔔 - Enterprise Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Padauk:wght@400;700&family=Pyidaungsu&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* =========================================================
   THEME
========================================================= */

:root[data-accent="indigo"] {
    --primary:#4f46e5;
    --primary-light:rgba(79,70,229,.15);
    --gradient:linear-gradient(135deg,#312e81 0%,#4f46e5 50%,#0284c7 100%);
}

:root[data-accent="emerald"] {
    --primary:#059669;
    --primary-light:rgba(5,150,105,.15);
    --gradient:linear-gradient(135deg,#064e3b 0%,#059669 50%,#0d9488 100%);
}

:root[data-accent="rose"] {
    --primary:#e11d48;
    --primary-light:rgba(225,29,72,.15);
    --gradient:linear-gradient(135deg,#881337 0%,#e11d48 50%,#c026d3 100%);
}

:root[data-accent="amber"] {
    --primary:#d97706;
    --primary-light:rgba(217,119,6,.15);
    --gradient:linear-gradient(135deg,#78350f 0%,#d97706 50%,#ea580c 100%);
}

:root[data-accent="purple"] {
    --primary:#7c3aed;
    --primary-light:rgba(124,58,237,.15);
    --gradient:linear-gradient(135deg,#4c1d95 0%,#7c3aed 50%,#db2777 100%);
}

:root[data-theme="light"] {
    --bg-gradient:linear-gradient(135deg,#e0e7ff 0%,#f3e8ff 50%,#e0f2fe 100%);
    --surface:rgba(255,255,255,.78);
    --surface-solid:#fff;
    --text-main:#0f172a;
    --text-sub:#64748b;
    --border:rgba(255,255,255,.65);
    --border-solid:#e2e8f0;
    --shadow:0 12px 35px rgba(31,38,135,.12);
    --glass-backdrop:blur(18px);
}

:root[data-theme="dark"] {
    --bg-gradient:linear-gradient(135deg,#0f172a 0%,#1e1b4b 55%,#020617 100%);
    --surface:rgba(30,41,59,.72);
    --surface-solid:#1e293b;
    --text-main:#f8fafc;
    --text-sub:#94a3b8;
    --border:rgba(255,255,255,.08);
    --border-solid:#334155;
    --shadow:0 12px 35px rgba(0,0,0,.4);
    --glass-backdrop:blur(18px);
}

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Padauk','Plus Jakarta Sans',sans-serif;
}

html {
    scroll-behavior:smooth;
}

body {
    background:var(--bg-gradient);
    background-attachment:fixed;
    color:var(--text-main);
    min-height:100vh;
    overflow-x:hidden;
}

button,
input,
select {
    font-family:inherit;
}

button {
    -webkit-tap-highlight-color:transparent;
}

#weather-fx-layer {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
}

/* =========================================================
   WEATHER
========================================================= */

.raindrop {
    position:absolute;
    width:1px;
    height:22px;
    background:linear-gradient(
        transparent,
        rgba(255,255,255,.85)
    );
    opacity:.7;
    transform:rotate(12deg);
    animation:fall linear infinite;
}

@keyframes fall {
    from {
        transform:translate(0,-30px) rotate(12deg);
    }
    to {
        transform:translate(-80px,110vh) rotate(12deg);
    }
}

.sun-ray {
    position:absolute;
    top:-50px;
    right:-50px;
    width:170px;
    height:170px;
    background:radial-gradient(
        circle,
        rgba(255,215,0,.45),
        transparent 70%
    );
    border-radius:50%;
    animation:pulseSun 4s ease-in-out infinite;
}

@keyframes pulseSun {
    0%,100% {
        transform:scale(1);
        opacity:.55;
    }
    50% {
        transform:scale(1.2);
        opacity:.9;
    }
}

.lightning-flash {
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.85);
    opacity:0;
}

@keyframes lightning {
    0%,100% {opacity:0}
    10% {opacity:1}
    20% {opacity:0}
    30% {opacity:.8}
    40% {opacity:0}
}

.music-note {
    position:absolute;
    color:var(--primary);
    opacity:.7;
    animation:floatNote linear infinite;
}

@keyframes floatNote {
    from {
        transform:translateY(105vh) scale(.8);
        opacity:0;
    }
    50% {
        opacity:1;
    }
    to {
        transform:translateY(-30px) scale(1.2);
        opacity:0;
    }
}

/* =========================================================
   APP
========================================================= */

.app-shell {
    width:100%;
    max-width:680px;
    min-height:100vh;
    margin:auto;
    position:relative;
    z-index:10;
    overflow-x:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.hero-header {
    background:var(--gradient);
    background-size:220% 220%;
    color:white;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
    animation:gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

.brand-container {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.brand-info {
    display:flex;
    align-items:center;
    gap:14px;
}

.cat-avatar {
    width:52px;
    height:52px;
    background:rgba(255,255,255,.18);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    border:2px solid rgba(255,215,0,.8);
    position:relative;
    backdrop-filter:blur(8px);
    animation:catFloat 3s ease-in-out infinite;
}

@keyframes catFloat {
    0%,100% {
        transform:translateY(0) rotate(0);
    }
    50% {
        transform:translateY(-5px) rotate(2deg);
    }
}

.bell-badge {
    position:absolute;
    bottom:-5px;
    right:-5px;
    background:#f59e0b;
    color:white;
    font-size:10px;
    width:19px;
    height:19px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid white;
}

.mm-clock-box {
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:13px;
    padding:8px 12px;
    margin-top:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
}

.settings-bar {
    display:flex;
    gap:7px;
    align-items:center;
    position:relative;
}

.icon-btn {
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    width:36px;
    height:36px;
    border-radius:11px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.icon-btn:hover {
    transform:translateY(-2px) scale(1.04);
    background:rgba(255,255,255,.3);
}

.icon-btn:active {
    transform:scale(.92);
}

/* =========================================================
   THEME DROPDOWN
========================================================= */

.theme-dropdown {
    position:absolute;
    top:44px;
    right:0;
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border:1px solid var(--border);
    border-radius:15px;
    padding:12px;
    box-shadow:var(--shadow);
    display:none;
    z-index:500;
    width:220px;
    color:var(--text-main);
}

.theme-dropdown.active {
    display:block;
    animation:dropdownIn .25s ease;
}

@keyframes dropdownIn {
    from {
        opacity:0;
        transform:translateY(-7px) scale(.96);
    }
    to {
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.color-bubbles {
    display:flex;
    gap:8px;
    margin-top:8px;
}

.color-bubble {
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid var(--border);
    transition:.2s;
}

.color-bubble:hover {
    transform:scale(1.15);
}

/* =========================================================
   DAILY VIBE
========================================================= */

.dynamic-vibe-container {
    margin:16px 20px 0;
}

.vibe-card {
    border-radius:18px;
    padding:16px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
}

.vibe-style-1 {
    background:linear-gradient(135deg,#1e1b4b,#312e81);
    color:white;
    border:1px solid rgba(255,215,0,.3);
    box-shadow:0 0 25px rgba(79,70,229,.35);
}

.vibe-style-2 {
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border:2px dashed var(--primary);
}

.vibe-style-3 {
    background:var(--surface-solid);
    border:2px solid var(--text-main);
    box-shadow:4px 4px 0 var(--primary);
}

.vibe-style-4 {
    background:#0f172a;
    color:#38bdf8;
    border-left:4px solid #38bdf8;
    font-family:monospace;
}

.vibe-style-5 {
    background:linear-gradient(
        135deg,
        rgba(5,150,105,.15),
        rgba(13,148,136,.2)
    );
    border:1px solid #059669;
}

.vibe-appear {
    animation:vibeAppear .5s ease;
}

@keyframes vibeAppear {
    from {
        opacity:0;
        transform:translateY(12px) scale(.98);
    }
    to {
        opacity:1;
        transform:none;
    }
}

/* =========================================================
   GAMIFICATION DASHBOARD
========================================================= */

.gamification-card {
    margin:16px 20px 0;
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
    box-shadow:var(--shadow);
    animation:cardEnter .5s ease;
}

.user-stats {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:12px;
}

.stat-box {
    background:var(--surface-solid);
    border:1px solid var(--border-solid);
    border-radius:12px;
    padding:9px 5px;
    text-align:center;
}

.stat-icon {
    font-size:18px;
    margin-bottom:2px;
}

.stat-value {
    font-size:15px;
    font-weight:700;
}

.stat-label {
    font-size:9px;
    color:var(--text-sub);
}

.xp-bar {
    height:8px;
    background:var(--border-solid);
    border-radius:10px;
    overflow:hidden;
    margin-top:7px;
}

.xp-progress {
    height:100%;
    background:linear-gradient(
        90deg,
        var(--primary),
        #38bdf8
    );
    border-radius:10px;
    transition:width .8s ease;
}

/* =========================================================
   DAILY CARDS
========================================================= */

.daily-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:16px 20px 0;
}

.daily-card {
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border:1px solid var(--border);
    border-radius:17px;
    padding:14px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.daily-card:hover {
    transform:translateY(-3px);
}

.daily-card:active {
    transform:scale(.98);
}

.daily-card.challenge {
    border-top:3px solid #f59e0b;
}

.daily-card.surprise {
    border-top:3px solid #ec4899;
}

.daily-icon {
    width:36px;
    height:36px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:7px;
    font-size:17px;
}

.challenge .daily-icon {
    background:rgba(245,158,11,.15);
    color:#f59e0b;
}

.surprise .daily-icon {
    background:rgba(236,72,153,.15);
    color:#ec4899;
}

.daily-title {
    font-size:11px;
    font-weight:700;
}

.daily-text {
    font-size:11px;
    line-height:1.55;
    margin-top:4px;
    color:var(--text-sub);
}

.challenge-btn {
    margin-top:8px;
    width:100%;
    border:none;
    border-radius:9px;
    padding:6px;
    background:#f59e0b;
    color:white;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

.challenge-btn.done {
    background:#10b981;
}

/* =========================================================
   OFFICE FUN
========================================================= */

.fun-card {
    margin:12px 20px 0;
    background:linear-gradient(
        135deg,
        rgba(124,58,237,.12),
        rgba(236,72,153,.12)
    );
    border:1px solid rgba(124,58,237,.25);
    border-radius:18px;
    padding:15px;
}

.fun-actions {
    display:flex;
    gap:6px;
    margin-top:10px;
}

.fun-reaction {
    flex:1;
    padding:6px;
    background:var(--surface);
    border:1px solid var(--border-solid);
    border-radius:9px;
    cursor:pointer;
    transition:.2s;
}

.fun-reaction:hover {
    transform:translateY(-2px);
}

/* =========================================================
   MOOD
========================================================= */

.mood-card {
    margin:12px 20px 0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:17px;
    padding:14px;
    box-shadow:var(--shadow);
}

.mood-grid {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin-top:9px;
}

.mood-btn {
    border:1px solid var(--border-solid);
    background:var(--surface-solid);
    border-radius:10px;
    padding:7px 2px;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.mood-btn:hover {
    transform:translateY(-3px);
}

/* =========================================================
   TABS
========================================================= */

.tab-bar {
    display:flex;
    gap:8px;
    padding:14px 20px 6px;
    margin-top:15px;
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border-bottom:1px solid var(--border);
}

.tab-btn {
    flex:1;
    padding:10px 5px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    font-weight:600;
    font-size:12px;
    color:var(--text-sub);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:.2s;
}

.tab-btn.active {
    background:var(--primary);
    color:white;
    border-color:var(--primary);
    box-shadow:0 5px 17px var(--primary-light);
}

.tab-btn:active {
    transform:scale(.96);
}

.main-content {
    padding:20px;
}

.tab-content {
    display:none;
}

.tab-content.active {
    display:block;
    animation:tabFade .35s ease;
}

@keyframes tabFade {
    from {
        opacity:0;
        transform:translateY(8px);
    }
    to {
        opacity:1;
        transform:none;
    }
}

/* =========================================================
   NOTICE
========================================================= */

.notice-card-modern {
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    position:relative;
    transition:.22s;
    animation:noticeEnter .45s ease both;
}

.notice-card-modern:hover {
    transform:translateY(-3px);
}

.notice-card-modern:active {
    transform:scale(.985);
}

.notice-card-modern.unread::before {
    content:'';
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:5px;
    background:var(--primary);
    border-radius:16px 0 0 16px;
}

@keyframes noticeEnter {
    from {
        opacity:0;
        transform:translateY(15px) scale(.98);
    }
    to {
        opacity:1;
        transform:none;
    }
}

.notice-card-modern:nth-child(2) {
    animation-delay:.05s;
}

.notice-card-modern:nth-child(3) {
    animation-delay:.1s;
}

.notice-card-modern:nth-child(4) {
    animation-delay:.15s;
}

.notice-card-modern:nth-child(5) {
    animation-delay:.2s;
}

/* =========================================================
   FORMS
========================================================= */

.form-card {
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    margin-bottom:16px;
}

.input-field,
select.input-field {
    padding:10px 14px;
    border:1px solid var(--border-solid);
    background:var(--surface-solid);
    color:var(--text-main);
    border-radius:12px;
    font-size:13px;
    outline:none;
    width:100%;
}

.input-field:focus {
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-light);
}

.input-group {
    position:relative;
    display:flex;
    align-items:center;
    width:100%;
}

.password-toggle {
    position:absolute;
    right:14px;
    background:none;
    border:none;
    color:var(--text-sub);
    cursor:pointer;
}

.btn-submit {
    background:var(--primary);
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 15px var(--primary-light);
    transition:.2s;
}

.btn-submit:hover {
    transform:translateY(-2px);
    box-shadow:0 8px 24px var(--primary-light);
}

.btn-submit:active {
    transform:scale(.95);
}

/* =========================================================
   EDITOR
========================================================= */

.editor-toolbar {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
    background:var(--surface-solid);
    padding:8px;
    border:1px solid var(--border-solid);
    border-bottom:none;
    border-radius:12px 12px 0 0;
}

.tool-btn,
.tool-select {
    background:var(--surface-solid);
    border:1px solid var(--border-solid);
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    color:var(--text-main);
    font-size:12px;
}

.editor-content {
    min-height:180px;
    max-height:300px;
    background:var(--surface-solid);
    border:1px solid var(--border-solid);
    border-radius:0 0 12px 12px;
    padding:14px;
    font-size:13px;
    outline:none;
    color:var(--text-main);
    overflow-y:auto;
}

.editor-content img,
.modal-body img {
    max-width:100%!important;
    height:auto!important;
    border-radius:8px;
    display:block;
    margin:8px auto;
}

/* =========================================================
   ACTIONS
========================================================= */

.action-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin:16px 0;
}

.btn-action {
    padding:8px 4px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-main);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    transition:.2s;
}

.btn-action:hover {
    transform:translateY(-2px);
}

.btn-action:active {
    transform:scale(.92);
}

.active-react {
    background:var(--primary-light)!important;
    border-color:var(--primary)!important;
    color:var(--primary)!important;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.65);
    backdrop-filter:blur(12px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:10px;
}

.modal-overlay.active {
    display:flex;
}

.modal-card {
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border-radius:20px;
    width:100%;
    max-width:500px;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    animation:modalOpen .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalOpen {
    from {
        opacity:0;
        transform:translateY(30px) scale(.94);
    }
    to {
        opacity:1;
        transform:none;
    }
}

.modal-header {
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-body {
    padding:16px;
    overflow-y:auto;
    flex:1;
    word-break:break-word;
}

.modal-close {
    background:var(--surface);
    border:1px solid var(--border);
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    color:var(--text-sub);
    display:flex;
    align-items:center;
    justify-content:center;
}

.staff-status-box {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-bottom:14px;
}

details.emoji-group {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 10px;
    margin-top:6px;
}

details.emoji-group summary {
    cursor:pointer;
    font-weight:600;
    font-size:12px;
    display:flex;

.staff-tag {
    display:inline-flex;
    background:var(--primary-light);
    color:var(--primary);
    padding:2px 8px;

    font-size:11px;

/* =========================================================
   LOGIN
========================================================= */

.login-overlay {
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    backdrop-filter:blur(20px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:3000;
    padding:20px;
}

.login-overlay::before {
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    background:var(--primary);
    border-radius:50%;
    filter:blur(110px);
    opacity:.25;
    animation:loginGlow 5s ease-in-out infinite alternate;
}

@keyframes loginGlow {
    from {
        transform:translate(-100px,-70px);
    }
    to {
        transform:translate(100px,70px);
    }
}

.login-card {
    position:relative;
    z-index:2;
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border:1px solid var(--border);
    border-radius:24px;
    width:100%;
    max-width:420px;
    padding:32px;
    box-shadow:var(--shadow);
    text-align:center;
    animation:loginAppear .6s cubic-bezier(.2,.8,.2,1);
}

@keyframes loginAppear {
    from {
        opacity:0;
        transform:translateY(30px) scale(.94);
    }
    to {
        opacity:1;
        transform:none;
    }
}

/* =========================================================
   TOAST
========================================================= */

#notification-toast {
    position:fixed;
    top:20px;
    right:20px;
    background:var(--surface);
    backdrop-filter:var(--glass-backdrop);
    border:1px solid var(--primary);
    border-left:5px solid var(--primary);
    padding:12px 18px;
    border-radius:14px;
    box-shadow:var(--shadow);
    z-index:4000;
    display:flex;
    align-items:center;
    gap:12px;
    transform:translateX(120%);
    max-width:330px;
}

#notification-toast.show {
    transform:translateX(0);
    animation:toastPop .5s cubic-bezier(.175,.885,.32,1.275);
}

@keyframes toastPop {
    0% {
        transform:translateX(120%) scale(.8);
        opacity:0;
    }
    70% {
        transform:translateX(-8px) scale(1.03);
        opacity:1;
    }
    100% {
        transform:translateX(0) scale(1);
    }
}
